name: Refresh data

on:
  # Manual trigger: Actions tab -> "Refresh data" -> "Run workflow"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate data.json
        run: python3 tools/generate_repwatch.py

      - name: Validate output
        run: |
          python3 - <<'EOF'
          import json, re, subprocess, sys

          new = json.load(open("data/data.json"))
          counts = new["meta"]["counts"]
          if counts["members"] < 400 or counts["votes"] < 10:
              sys.exit(f"Aborting: data too small ({counts})")

          # Content sanity: data.json is rendered by the web app, so refuse
          # anything that looks like an injection payload or a bad link.
          html_chars = re.compile(r"[<>]")
          for m in new["members"]:
              for field in ("name", "state", "party", "left"):
                  val = m.get(field)
                  if isinstance(val, str) and html_chars.search(val):
                      sys.exit(f"Aborting: HTML chars in member {m.get('id')!r} "
                               f"field {field!r}: {val!r}")
          bill_url = re.compile(r"^https?://www\.congress\.gov/")
          for key, b in new["bills"].items():
              u = b.get("url") or ""
              if u and not bill_url.match(u):
                  sys.exit(f"Aborting: unexpected bill URL {u!r} (bill {key})")
          vote_date = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          for v in new["votes"]:
              if not vote_date.match(v.get("date", "")):
                  sys.exit(f"Aborting: bad vote date {v.get('date')!r} (vote {v.get('id')!r})")

          # If the committed file covers the same Congress, a big vote-count
          # drop means this run likely failed partway through, bail.
          try:
              old = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:data/data.json"], text=True))
          except Exception:
              old = None
          if old and old["meta"]["congress"] == new["meta"]["congress"]:
              old_votes = old["meta"]["counts"]["votes"]
              if counts["votes"] < 0.9 * old_votes:
                  sys.exit(f"Aborting: votes dropped {old_votes} -> {counts['votes']} (partial run?)")

          print("OK:", counts)
          EOF

      - name: Commit and push if changed
        run: |
          if git diff --exit-code -- data/data.json; then
            echo "data.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Refresh voting data ($(date -u +%Y-%m-%d))"
          git push
          echo "data.json updated"
